[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goldbrain-backend"
version = "0.2.0"
description = "Private-alpha backend for GoldBrain market intelligence"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Keep the CI rule set explicit across Ruff releases. FastAPI dependency
# declarations and modernization/import-order rules remain outside this
# project's existing baseline lint contract.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
